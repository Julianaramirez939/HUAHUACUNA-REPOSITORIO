<div class="reporte-btn-container">
  <button class="btn-reporte" (click)="generarPdf()">
    <i class="fas fa-file-pdf"></i>
    Generar PDF
  </button>
</div>

<div class="noticias-container">
  <div class="selector-ninos">
    <label for="childSelect">Filtrar por niño:</label>

    <select
      id="childSelect"
      [(ngModel)]="selectedChildId"
      (change)="cargarNoticias()"
    >
      <option [ngValue]="null">Todos</option>
      <option *ngFor="let n of ninos" [ngValue]="n.id">
        {{ n.full_name }}
      </option>
    </select>
  </div>

  <p *ngIf="cargando" class="loading">Cargando noticias...</p>

  <p *ngIf="!cargando && noticias.length === 0" class="sin-noticias">
    No hay noticias de este niño aún.
  </p>

  <div class="noticias-grid" *ngIf="noticias.length > 0">
    <article class="noticia-card" *ngFor="let noticia of noticias">
      <div class="noticia-meta">
        <span class="label-ninos">Niños:</span>
        <span class="nombres">{{ noticia.nombresNinos }}</span>
      </div>

      <h3 class="titulo">{{ noticia.titulo }}</h3>

      <div class="imagen-wrapper" *ngIf="noticia.imagen">
        <img [src]="noticia.imagen" class="noticia-img" alt="Imagen" />
      </div>

      <a
        class="ver-imagen"
        target="_blank"
        [href]="noticia.imagen"
        *ngIf="noticia.imagen"
      >
        Ver imagen
      </a>

      <div class="descripcion-card">
        <p class="descripcion-text">
          {{ noticia.descripcion }}
        </p>
      </div>

      <p class="fecha">{{ noticia.fecha }}</p>
    </article>
  </div>
</div>
