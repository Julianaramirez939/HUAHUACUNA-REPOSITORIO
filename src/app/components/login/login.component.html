<app-fondo-imagen [brillo]="0.6"></app-fondo-imagen>
<button class="btn-back" (click)="volverInicio()" aria-label="Volver al inicio">
  <i class="fa-solid fa-arrow-left"></i>
</button>
<div class="login-container">
  <img [src]="logo" alt="Logo de la Fundación Huahuacuna" class="login-logo" />

  <h2 class="login-title">Inicia sesión</h2>

  <form
    [formGroup]="formularioLogin"
    (ngSubmit)="enviarFormulario()"
    class="login-form"
    novalidate
  >
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        type="text"
        id="email"
        name="email"
        formControlName="email"
        class="login-input"
        [class.input-error]="f['email'].touched && f['email'].invalid"
        [attr.aria-invalid]="f['email'].invalid"
        autocomplete="username"
      />

      <p
        *ngIf="f['email'].touched && f['email'].hasError('required')"
        class="error-message"
        role="alert"
      >
        El usuario es obligatorio.
      </p>

      <p
        *ngIf="f['email'].touched && f['email'].hasError('email')"
        class="error-message"
        role="alert"
      >
        El usuario debe ser una dirección de correo válida.
      </p>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        [type]="mostrarContrasena ? 'text' : 'password'"
        id="password"
        name="password"
        formControlName="password"
        class="login-input"
        [class.input-error]="f['password'].touched && f['password'].invalid"
        [attr.aria-invalid]="f['password'].invalid"
        autocomplete="current-password"
      />

      <p
        *ngIf="f['password'].touched && f['password'].hasError('required')"
        class="error-message"
        role="alert"
      >
        La contraseña es obligatoria.
      </p>

      <label class="show-password-checkbox">
        <input
          type="checkbox"
          [checked]="mostrarContrasena"
          (change)="alternarContrasena()"
        />
        Mostrar contraseña
      </label>
    </div>

    <button
      type="submit"
      class="btn-login"
      [disabled]="formularioLogin.invalid"
      [attr.aria-disabled]="formularioLogin.invalid"
    >
      Iniciar Sesión
    </button>

    <button type="button" class="btn-register" (click)="irARegistroPadrino()">
      Registrarse como padrino
    </button>

    <div class="forgot-password">
      <a routerLink="/recuperar">¿Olvidaste tu contraseña?</a>
    </div>
  </form>
</div>
