<nav class="navbar">

    <img [src]="logo" alt="Logo Fundación Huahuacuna" />
  </div>

  <ul class="navbar-links">
    <!-- Navegación relativa: solo nombres de rutas hijas -->
  

    <li (click)="irA('ninos-bitacora')">
      <i class="fa-solid fa-heart"></i> Apadrinamiento
    </li>

    <li (click)="irA('ninos-apadrinados')">
      <i class="fa-solid fa-heart"></i> Mis niños
    </li>
  </ul>
