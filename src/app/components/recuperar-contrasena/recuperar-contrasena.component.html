<app-fondo-imagen [brillo]="0.6"></app-fondo-imagen>

<div class="forgot-container">
  <div class="forgot-content">
    <img [src]="logo" alt="Logo Fundación Huahuacuna" class="forgot-logo" />

    <h2 class="forgot-title">Recuperar Contraseña</h2>

    <form [formGroup]="formularioRecuperar" (ngSubmit)="enviarEmail()" novalidate>
      <label for="correo" class="forgot-label">Correo electrónico</label>
      <input
        type="email"
        id="correo"
        formControlName="correo"
        class="forgot-input"
        [class.input-error]="f['correo'].touched && f['correo'].invalid"
        [attr.aria-invalid]="f['correo'].invalid"
      />

      <p *ngIf="f['correo'].touched && f['correo'].hasError('required')" class="error-msg">
        El correo es obligatorio.
      </p>
      <p *ngIf="f['correo'].touched && f['correo'].hasError('pattern')" class="error-msg">
        Por favor, ingresa un correo electrónico válido.
      </p>

      <button type="submit" class="btn-send" [disabled]="formularioRecuperar.invalid">
        Enviar
      </button>
    </form>

    <div class="back-to-login">
      <a (click)="volverAlInicio()">Volver al inicio</a>
    </div>
  </div>
</div>
